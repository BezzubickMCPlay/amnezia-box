name: Build AWG for Pixel 10

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g., 1.13.0-alpha.36)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Pixel 10 использует архитектуру ARM64. 
          # GOOS=android предпочтительнее linux для работы DNS резолвера Android.
          - name: android-arm64-pixel10
            goos: android
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.24

      - name: Vendor dependencies and apply patches
        run: |
          go mod vendor
          # Проверяем и применяем патчи для AmneziaWG, если они есть в репозитории
          if [ -f "./patches/amneziawg-go/apply.sh" ]; then
            chmod +x ./patches/amneziawg-go/apply.sh
            echo "Applying AWG patches..."
            ./patches/amneziawg-go/apply.sh
          else
            echo "WARNING: Patch script not found or not executable"
          fi

      - name: Build
        run: |
          mkdir -p dist
          # Формируем имя файла
          OUTPUT_NAME="sing-box-${{ inputs.version }}-awg-android-arm64"

          # CGO_ENABLED=0 создает статический бинарник, который будет работать на любом Android без зависимостей от libc
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -v -trimpath -o "dist/${OUTPUT_NAME}" \
            -tags "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_awg" \
            -ldflags="-s -w -buildid= -X github.com/sagernet/sing-box/constant.Version=${{ inputs.version }}-awg" \
            ./cmd/sing-box
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-android-arm64
          path: dist/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ inputs.version }}-awg-pixel"

          # Delete existing release if exists
          gh release delete "${VERSION}" --yes --repo ${{ github.repository }} 2>/dev/null || true

          # Create release notes
          cat > notes.md << 'EOF'
          ## sing-box for Pixel 10 (Android ARM64) with AWG

          ### Build Info:
          - **Target:** Android ARM64 (Pixel 10 compatible)
          - **Tags:** with_awg (AmneziaWG), with_gvisor, with_utls, with_clash_api

          ### AWG Features:
          - Jmin/Jmax/Jc support
          - H1-H4 header support
          - S1/S2 packet size support
          EOF

          # Create release
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${VERSION}" \
            --repo ${{ github.repository }} \
            --title "Sing-Box Android AWG Build ${VERSION}" \
            ${PRERELEASE_FLAG} \
            --notes-file notes.md \
            dist/*
